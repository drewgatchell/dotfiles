---
- name: Ensure .ssh directory exists with correct permissions
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}/.ssh"
    state: directory
    mode: '0700'

- name: Check for existing SSH config
  ansible.builtin.stat:
    path: "{{ ansible_env.HOME }}/.ssh/config"
  register: ssh_config

- name: Backup existing SSH config if it's a file (not symlink)
  ansible.builtin.copy:
    src: "{{ ansible_env.HOME }}/.ssh/config"
    dest: "{{ ansible_env.HOME }}/.ssh/config.backup"
    remote_src: true
    mode: '0600'
  when:
    - ssh_config.stat.exists
    - not ssh_config.stat.islnk

- name: Display SSH agent setup instructions
  ansible.builtin.debug:
    msg: |
      ============================================
      SSH Agent Setup (Bitwarden or 1Password)
      ============================================
      The zshrc auto-detects whichever socket is present.

      Bitwarden (personal — installed by this playbook):
        1. Install Bitwarden Desktop application
        2. Open Bitwarden > Settings > SSH Agent > Enable
        3. Add your SSH keys to Bitwarden vault

      1Password (work — typically managed by MDM, not installed here):
        1. Open 1Password > Settings > Developer
        2. Enable "Use the SSH agent"
        3. Add your SSH keys to 1Password vault
      ============================================
