---
# Dotfiles directory
dotfiles_dir: "{{ ansible_facts['env']['HOME'] }}/.dotfiles"

# Tool versions
python_version: "3.14"

# Homebrew packages (macOS)
homebrew_packages:
  - fastfetch
  - starship
  - pipx
  - uv
  - git
  - gh
  - jq
  - fzf
  - ripgrep
  - neovim
  - bitwarden-cli

# Casks may declare `app` so the role can skip install when the app
# already exists in /Applications (e.g. a self-updating app like Ghostty
# that the user installed manually). Omit `app` for CLI-only casks.
homebrew_casks:
  - name: ghostty
    app: Ghostty.app
  - name: google-cloud-sdk
  - name: jetbrains-toolbox
    app: JetBrains Toolbox.app
  - name: zed
    app: Zed.app

# APT packages (Linux)
apt_packages:
  - build-essential
  - curl
  - git
  - unzip
  - zsh
  - fzf
  - ripgrep
  - jq

# Symlinks to create
# Format: { src: path relative to dotfiles_dir, dest: absolute path }
dotfile_links:
  - src: shell/zshrc
    dest: "{{ ansible_facts['env']['HOME'] }}/.zshrc"
  - src: git/gitconfig
    dest: "{{ ansible_facts['env']['HOME'] }}/.gitconfig"
  - src: git/gitignore_global
    dest: "{{ ansible_facts['env']['HOME'] }}/.gitignore_global"
  - src: ssh/config
    dest: "{{ ansible_facts['env']['HOME'] }}/.ssh/config"
  - src: starship/starship.toml
    dest: "{{ ansible_facts['env']['HOME'] }}/.config/starship.toml"
  - src: nvim
    dest: "{{ ansible_facts['env']['HOME'] }}/.config/nvim"
  - src: ghostty/config
    dest: "{{ ansible_facts['env']['HOME'] }}/.config/ghostty/config"
  - src: zed/settings.json
    dest: "{{ ansible_facts['env']['HOME'] }}/.config/zed/settings.json"
